<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f7f7f2">
<title>急炎派對!!!｜像素打地鼠</title>
<style>
:root{--ink:#171717;--paper:#f7f7f2;--muted:#d8d8d0;--accent:#f3d34a;--red:#e85b50}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:"Courier New",monospace;image-rendering:pixelated}
button{font:inherit;color:inherit}.wrap{max-width:760px;margin:auto;padding:22px 16px 38px}
header{text-align:center;border:4px solid var(--ink);padding:18px 12px;background:white;box-shadow:7px 7px 0 var(--ink)}
h1{font-size:clamp(27px,7vw,48px);line-height:1.05;margin:0 0 8px;letter-spacing:1px;text-shadow:3px 3px 0 var(--accent)}
.sub{font-size:12px;letter-spacing:2px}.hud{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:22px 0 14px}
.stat{border:3px solid var(--ink);background:white;text-align:center;padding:9px 4px;box-shadow:3px 3px 0 var(--ink)}
.stat small{display:block;font-size:11px;margin-bottom:5px}.stat strong{font-size:clamp(20px,5vw,30px);font-weight:900}
.board{border:4px solid var(--ink);background:#e7e7df;padding:12px;box-shadow:7px 7px 0 var(--ink)}
.holes{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.hole{position:relative;aspect-ratio:1.12;min-height:90px;border:3px solid var(--ink);background:#c9c9bf;overflow:hidden;cursor:pointer;touch-action:manipulation;user-select:none}
.hole:before{content:"";position:absolute;width:72%;height:33%;left:14%;bottom:9%;border:3px solid var(--ink);background:#555;border-radius:50%;box-shadow:inset 0 5px 0 #333}
.hole .sprite{position:absolute;width:75%;height:78%;left:12.5%;bottom:10%;display:grid;place-items:center;transform:translateY(120%);transition:transform .12s steps(3);pointer-events:none}
.hole.up .sprite{transform:translateY(0)}
.sprite svg{width:100%;height:100%;overflow:visible;shape-rendering:crispEdges;filter:drop-shadow(3px 3px 0 #222)}
.hole.hit{background:#fff1a8}.hole.bomb .sprite svg{filter:drop-shadow(3px 3px 0 #222)}
.controls{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:18px 0}
.btn{border:3px solid var(--ink);background:var(--accent);padding:12px 22px;font-weight:bold;box-shadow:4px 4px 0 var(--ink);cursor:pointer}
.btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}.btn.secondary{background:white}
.help{text-align:center;font-size:12px;line-height:1.8;margin:15px 0}
.message{min-height:28px;text-align:center;font-weight:bold;font-size:15px;margin:8px}
footer{text-align:center;font-size:10px;margin-top:24px;letter-spacing:1px}
.overlay{position:fixed;inset:0;background:#171717d9;display:none;place-items:center;padding:18px;z-index:5}.overlay.show{display:grid}
.dialog{background:var(--paper);border:4px solid white;outline:4px solid var(--ink);padding:24px;max-width:360px;width:100%;text-align:center;box-shadow:9px 9px 0 #000}
.dialog h2{font-size:27px;margin:0 0 8px}.finalscore{font-size:42px;font-weight:bold;margin:10px}
@media(max-width:420px){.wrap{padding:14px 12px 28px}.holes{gap:7px}.board{padding:8px}.hole{min-height:78px}.hud{gap:6px}.stat{padding:7px 2px}}
</style>
</head>
<body>
<main class="wrap">
<header><h1>急炎派對!!!</h1><div class="sub">PIXEL BIRD WHACK PARTY · 8-BIT GAME</div></header>
<section class="hud" aria-label="遊戲資訊">
<div class="stat"><small>SCORE 分數</small><strong id="score">000</strong></div>
<div class="stat"><small>TIME 時間</small><strong id="time">30</strong></div>
<div class="stat"><small>BEST 最高分</small><strong id="best">000</strong></div>
</section>
<section class="board"><div class="holes" id="holes" aria-label="九宮格遊戲區"></div></section>
<div class="message" id="message" aria-live="polite">準備好了嗎？小鳥出現就快點擊！</div>
<div class="controls"><button class="btn" id="start">▶ 開始遊戲</button><button class="btn secondary" id="reset">↻ 重新開始</button></div>
<p class="help">🐦 打中小鳥 <b>+10 分</b>　　💣 打中炸彈 <b>-20 分</b><br>電腦可按鍵盤 <b>1–9</b> 對應九宮格，也可用滑鼠或手機觸控。</p>
<footer>急炎派對!!! · HAVE FUN & WATCH OUT FOR BOMBS</footer>
</main>
<div class="overlay" id="overlay"><div class="dialog"><h2>TIME UP!</h2><div>本次得分</div><div class="finalscore" id="finalscore">0</div><div id="resultline"></div><br><button class="btn" id="again">再玩一次！</button></div></div>
<script>
const birds=[
'<svg viewBox="0 0 64 64" aria-label="小鳥一"><g stroke="#171717" stroke-width="3" stroke-linejoin="miter"><path fill="#fff" d="M15 26 20 14 30 18 40 14 48 25 52 39 44 52 20 52 10 40Z"/><path fill="#171717" d="M22 28h5v6h-5zm18 0h5v6h-5z"/><path fill="#f3d34a" d="m29 37 8 0-4 7z"/><path fill="#fff" d="m17 23-8-8 13 3m27 5 8-8-13 3"/></g></svg>',
'<svg viewBox="0 0 64 64" aria-label="小鳥二"><g stroke="#171717" stroke-width="3" stroke-linejoin="miter"><path fill="#fff" d="M13 29 18 18 28 20 35 12 45 22 52 35 47 51 18 51 9 39Z"/><path fill="#171717" d="M21 31h5v6h-5zm19 0h5v6h-5z"/><path fill="#e85b50" d="m29 40 9 0-5 7z"/><path fill="#fff" d="m17 25-8-7 13 3m28 4 7-9-13 4"/></g></svg>',
'<svg viewBox="0 0 64 64" aria-label="小鳥三"><g stroke="#171717" stroke-width="3" stroke-linejoin="miter"><path fill="#fff" d="M14 28 20 17 30 19 42 14 50 29 52 41 42 52 18 52 9 40Z"/><path fill="#171717" d="M22 30h5v6h-5zm18 0h5v6h-5z"/><path fill="#f3d34a" d="m29 40 9 0-5 7z"/><path fill="#fff" d="m18 25-6-11 14 6m24 5 8-10-14 5"/></g></svg>'
];
const bomb='<svg viewBox="0 0 64 64" aria-label="炸彈"><g stroke="#171717" stroke-width="3"><path fill="#fff" d="m39 12 7-8 8 5-7 10"/><path fill="#fff" d="M34 14c13 0 22 10 22 23S45 58 31 58 8 48 8 35 19 14 34 14Z"/><path fill="#171717" d="m23 26 5 5-5 5-5-5zm18 0 5 5-5 5-5-5z"/><path fill="none" d="m25 44 6 3 7-3"/></g><path stroke="#e85b50" stroke-width="4" d="m49 5 4-3m2 9 5-2"/></svg>';
const holesEl=document.getElementById('holes'),scoreEl=document.getElementById('score'),timeEl=document.getElementById('time'),bestEl=document.getElementById('best'),message=document.getElementById('message');
let score=0,best=Number(localStorage.getItem('jyBest')||0),time=30,running=false,timer=null,spawnTimer=null,current=-1,kind='bird',round=0;
bestEl.textContent=String(best).padStart(3,'0');
for(let i=0;i<9;i++){const h=document.createElement('button');h.className='hole';h.type='button';h.setAttribute('aria-label','洞口 '+(i+1));h.innerHTML='<span class="sprite"></span>';h.addEventListener('click',()=>hit(i));holesEl.appendChild(h)}
const cells=[...document.querySelectorAll('.hole')];
function clearHole(){cells.forEach(c=>{c.classList.remove('up','bomb');c.querySelector('.sprite').innerHTML=''}) ;current=-1}
function spawn(){if(!running)return;clearHole();current=Math.floor(Math.random()*9);kind=Math.random()<.22?'bomb':'bird';const cell=cells[current];cell.classList.toggle('bomb',kind==='bomb');cell.querySelector('.sprite').innerHTML=kind==='bomb'?bomb:birds[Math.floor(Math.random()*birds.length)];cell.classList.add('up');const thisRound=++round;setTimeout(()=>{if(running&&round===thisRound)clearHole()},700+Math.random()*350)}
function hit(i){if(!running||i!==current||!cells[i].classList.contains('up'))return;const c=cells[i];if(kind==='bomb'){score=Math.max(0,score-20);message.textContent='💥 炸彈！ -20 分';}else{score+=10;message.textContent='✨ 命中小鳥！ +10 分';}scoreEl.textContent=String(score).padStart(3,'0');c.classList.add('hit');round++;clearHole();setTimeout(()=>c.classList.remove('hit'),130)}
function finish(){running=false;clearInterval(timer);clearTimeout(spawnTimer);clearHole();best=Math.max(best,score);localStorage.setItem('jyBest',String(best));bestEl.textContent=String(best).padStart(3,'0');document.getElementById('finalscore').textContent=score;document.getElementById('resultline').textContent=score>=best?'新紀錄！太厲害了！':'最高紀錄：'+best+' 分';document.getElementById('overlay').classList.add('show');message.textContent='時間到！再挑戰一次吧！';}
function start(){clearInterval(timer);clearTimeout(spawnTimer);score=0;time=30;round++;running=true;scoreEl.textContent='000';timeEl.textContent='30';message.textContent='開始！快打小鳥，避開炸彈！';document.getElementById('overlay').classList.remove('show');spawn();spawnTimer=setInterval(spawn,850);timer=setInterval(()=>{time--;timeEl.textContent=String(time).padStart(2,'0');if(time<=0)finish()},1000)}
document.getElementById('start').addEventListener('click',start);document.getElementById('reset').addEventListener('click',start);document.getElementById('again').addEventListener('click',start);
document.addEventListener('keydown',e=>{if(/^[1-9]$/.test(e.key))hit(Number(e.key)-1);if(e.key==='Enter'&&!running)start()});
</script>
</body></html>
